version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grocerygrid
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata_grocery:/var/lib/postgresql/data
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seeds:/seeds:ro
      - ./seeds/02-run-seeds.sh:/docker-entrypoint-initdb.d/02-run-seeds.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d grocerygrid -U grocery_user" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Drogon API backend ────────────────────────────────────────────────────
  # Not exposed to the host — nginx proxies /api/* traffic to port 8080.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No host port binding; only reachable inside the Docker network.
    expose:
      - "8080"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: grocerygrid
      PGUSER: grocery_user
      DATABASE_URL: "postgresql://grocery_user:${POSTGRES_PASSWORD:-changeme}@db:5432/grocerygrid"
      INIT_DB: "false"
      TABSCANNER_API_KEY: ${TABSCANNER_API_KEY}
    secrets:
      - config_json
      - model_json
    volumes:
      - uploads:/app/uploads

  # ─── nginx (reverse proxy + SPA host) ─────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

# ─── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  config_json:
    file: ./config.json
  model_json:
    file: ./models/model.json

volumes:
  pgdata_grocery:
  uploads:
